spring.application.name=salary-management

spring.datasource.url=jdbc:postgresql://localhost:5432/salary_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=250
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_schema=salary_management

spring.flyway.enabled=true
spring.flyway.default-schema=salary_management
spring.flyway.schemas=salary_management
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info

app.seed.enabled=false
